<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperScope - Semantic Paper Search</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  :root {
    --bg: #0a0a0b;
    --surface: #141416;
    --surface-elev: #1c1c1e;
    --border: #2a2a2c;
    --text: #f2f2f2;
    --text-muted: #949496;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-glow: rgba(59, 130, 246, 0.3);
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
    --glass: rgba(255, 255, 255, 0.03);
    --glass-border: rgba(255, 255, 255, 0.08);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200vw;
    height: 200vh;
    background: radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.08) 0%, transparent 50%);
    z-index: -1;
    pointer-events: none;
  }

  header {
    background: var(--surface);
    color: #fff;
    padding: 16px 24px;
    font-size: 18px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .logo-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 12px var(--accent-glow);
  }

  .container {
    display: flex;
    height: calc(100vh - 48px);
    gap: 16px;
    padding: 16px;
    overflow: hidden;
  }

  .left-panel {
    flex: 0 0 360px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }

  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
  }

  h2 {
    font-size: 16px;
    margin-bottom: 14px;
    color: #fff;
    font-weight: 600;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  h2 .icon {
    color: var(--accent);
  }

  .section {
    background: var(--surface-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    width: 100%;
    text-align: center;
    text-decoration: none;
    display: inline-block;
  }

  .btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px var(--accent-glow);
  }

  .btn:active {
    transform: translateY(0);
  }

  .btn:disabled {
    background: #333335;
    color: #888;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }

  .btn.secondary {
    background: var(--surface-elev);
    color: #fff;
    border: 1px solid var(--border);
  }

  .btn.secondary:hover {
    background: var(--border);
    border-color: var(--border-hover);
  }

  .btn-sm {
    padding: 8px 14px;
    font-size: 13px;
    width: auto;
  }

  .input-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .input-row {
    display: flex;
    gap: 10px;
  }

  .file-input-wrapper {
    position: relative;
    display: flex;
    gap: 10px;
  }

  input[type="text"],
  textarea,
  input[type="file"] {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: inherit;
    background: #0a0a0b;
    color: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input[type="text"]:focus,
  textarea:focus,
  input[type="file"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  textarea {
    resize: vertical;
    min-height: 100px;
    font-family: inherit;
  }

  textarea::placeholder {
    color: var(--muted);
  }

  .status {
    font-size: 13px;
    color: var(--text-muted);
    background: var(--surface-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    min-height: 56px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-direction: column;
  }

  .status-item {
    display: flex;
    justify-content: space-between;
    width: 100%;
  }

  .status-value {
    font-weight: 600;
    color: #fff;
    font-family: "SF Mono", "Consolas", monospace;
    font-size: 13px;
  }

  .card {
    background: var(--surface-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .result-card {
    background: var(--surface-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    flex: 0 0 auto;
  }

  .result-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }

  .score-badge {
    background: var(--accent);
    color: #fff;
    padding: 8px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 700;
  }

  .score-badge.weak {
    background: #f59e0b;
  }

  .score-badge.failed {
    background: var(--danger);
  }

  .score-badge strong {
    font-size: 17px;
  }

  .paper-title {
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 8px 0;
    color: #fff;
  }

  .paper-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin: 2px 0;
    line-height: 1.4;
  }

  .preview {
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    color: #e0e0e0;
    border-top: 1px solid var(--border);
    padding-top: 16px;
    margin-top: 16px;
    max-height: 220px;
    overflow-y: auto;
  }

  .scores-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }

  .scores-table th {
    text-align: left;
    color: var(--text-muted);
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .scores-table td {
    padding: 10px 8px;
    border-bottom: 1px solid var(--border);
  }

  .scores-table tr:hover {
    background: rgba(255, 255, 255, 0.02);
  }

  .scores-table tr:last-child td {
    border-bottom: none;
  }

  .rank {
    font-weight: 700;
    color: var(--text-muted);
    font-family: "SF Mono", "Consolas", monospace;
  }

  .truncated-badge {
    background: #f59e0b;
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    font-weight: 600;
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 13px;
    padding: 20px;
    text-align: center;
  }

  .error-banner {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    padding: 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    font-size: 13px;
    display: none;
  }

  .success-banner {
    background: rgba(16, 185, 129, 0.1);
    border: 1px solid rgba(16, 185, 129, 0.2);
    color: #86efac;
    padding: 14px;
    border-radius: var(--radius-sm);
    margin-bottom: 16px;
    font-size: 13px;
    display: none;
  }

  .list-item {
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.2s;
    border: 1px solid transparent;
    margin-bottom: 6px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .list-item:hover {
    background: rgba(255, 255, 255, 0.03);
    border-color: var(--border-hover);
  }

  .list-item.selected {
    background: rgba(59, 130, 246, 0.1);
    border-color: var(--accent);
  }

  .list-item-title {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }

  .list-item-meta {
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    gap: 12px;
  }

  .list-item-meta span {
    display: inline-block;
  }

  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 10, 11, 0.85);
    backdrop-filter: blur(4px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    flex-direction: column;
    gap: 16px;
  }

  .loading-text {
    color: #fff;
    font-size: 15px;
    font-weight: 500;
  }

  .tab-group {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .tab-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    padding: 8px 16px;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .tab-btn:hover {
    color: var(--accent);
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  .tab-content {
    display: none;
  }

  .tab-content.active {
    display: block;
  }

  @media (max-width: 900px) {
    .container {
      flex-direction: column;
    }
    .left-panel {
      flex: 0 0 auto;
      max-height: none;
      max-height: 350px;
    }
    .right-panel {
      flex: 1;
    }
  }

  @media (max-width: 600px) {
    .container {
      padding: 12px;
      gap: 12px;
    }
    .left-panel,
    .right-panel {
      max-height: none;
    }
  }
</style>
</head>
<body>
<header>
  <div class="logo-dot"></div>
  PaperScope - Semantic Paper Search
</header>
<div class="container">
  <div class="left-panel">
    <section class="section">
      <h2><span class="icon">📄</span> Add Paper</h2>
      <div class="input-group">
        <div class="file-input-wrapper">
          <input type="text" id="pdfPath" placeholder="C:\Path\To\paper.pdf" style="flex:1;">
          <input type="file" id="filePicker" accept=".pdf" style="display:none;">
          <button class="btn secondary btn-sm" id="browseBtn">Browse</button>
        </div>
        <input type="text" id="paperName" placeholder="Paper title">
        <button class="btn" id="addBtn">Add Paper</button>
        <div id="addBanner" class="success-banner"></div>
        <div id="addErrorBanner" class="error-banner"></div>
      </section>

      <section class="section">
        <h2><span class="icon">📚</span> Collection</h2>
        <div class="section-header">
          <span></span>
          <button class="btn secondary btn-sm" id="listBtn">Refresh List</button>
        </div>
        <ul id="paperList" style="list-style:none;padding:0;margin:0;">
        </ul>
        <div id="collectionEmpty" class="empty-state" style="margin-top:16px;">No papers yet.</div>
      </section>
    </div>

    <div class="right-panel">
      <section class="card">
        <h2><span class="icon">💬</span> Ask a Question</h2>
        <div class="tab-group">
          <button class="tab-btn active" id="tabText">Text Question</button>
          <button class="tab-btn" id="tabDocument">Document Question</button>
        </div>

        <div id="tabTextContent" class="tab-content active">
          <textarea id="question" placeholder="Type your research question here..."></textarea>
          <button class="btn" id="askBtn">Ask</button>
        </div>

        <div id="tabDocumentContent" class="tab-content">
          <div class="file-input-wrapper">
            <input type="text" id="docPath" placeholder="C:\Path\To\query.pdf" style="flex:1;">
            <input type="file" id="docFilePicker" accept=".pdf" style="display:none;">
            <button class="btn secondary btn-sm" id="docBrowseBtn">Browse</button>
          </div>
          <button class="btn" id="askDocBtn">Ask with Document</button>
        </div>
      </section>

      <section class="result-card">
        <h2>Closest Match</h2>
        <div id="resultHeader" style="display:none;">
          <div>
            <div class="paper-title" id="resultTitle"></div>
            <div class="paper-meta" id="resultMeta"></div>
          </div>
          <div class="score-badge" id="resultScore">Similarity: --</div>
        </div>
        <div id="resultPreview" class="preview" style="display:none;"></div>
      </section>

      <section class="card">
        <h2>All Paper Scores</h2>
        <table class="scores-table" id="scoresTable">
          <thead>
            <tr>
              <th style="width:50px;">Rank</th>
              <th style="width:80px;">Score</th>
              <th style="width:160px;">Key</th>
              <th>Title</th>
              <th style="width:120px;">Status</th>
            </tr>
          </thead>
          <tbody id="scoresBody">
            <tr>
              <td colspan="5" class="empty-state">Ask a question to see rankings.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">Loading...</div>
</div>

<script>
  const API = '/api';
  const el = id => document.getElementById(id);
  let currentPapers = [];
  let overlayCount = 0;

  function showLoading(show) {
    const overlay = el('loadingOverlay');
    if (show) {
      overlayCount++;
      overlay.style.display = 'flex';
    } else {
      overlayCount = Math.max(0, overlayCount - 1);
      if (overlayCount === 0) overlay.style.display = 'none';
    }
  }

  async function fetchJSON(path, method = 'GET', body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/x-www-form-urlencoded' } };
    if (body) opts.body = new URLSearchParams(body).toString();
    const res = await fetch(API + path, opts);
    const text = await res.text();
    try { return { ok: res.ok, data: JSON.parse(text) }; } catch { return { ok: false, data: { error: text || res.statusText } }; }
  }

  async function loadStatus() {
    const r = await fetchJSON('/status');
    if (r.ok) {
      el('status').innerHTML = `<span style="font-weight:600;">${r.data.paper_count}</span> papers &bull; Model: ${r.data.model}`;
    } else {
      el('status').textContent = 'Error loading status.';
    }
  }

  async function loadPapers() {
    const r = await fetchJSON('/papers');
    const list = el('paperList');
    const empty = el('collectionEmpty');
    list.innerHTML = '';
    currentPapers = r.data.papers || [];

    if (currentPapers.length === 0) {
      empty.style.display = 'block';
    } else {
      empty.style.display = 'none';
      currentPapers.forEach((p) => {
        const li = document.createElement('li');
        li.className = 'list-item';
        li.style.display = 'flex';
        li.style.justifyContent = 'space-between';
        li.style.alignItems = 'center';
        const info = document.createElement('div');
        info.textContent = `${p.key} — ${p.title}`;
        if (p.truncated) {
          const badge = document.createElement('span');
          badge.className = 'truncated-badge';
          badge.textContent = 'truncated';
          info.appendChild(document.createTextNode(' '));
          info.appendChild(badge);
        }
        const meta = document.createElement('div');
        meta.style.fontSize = '11px';
        meta.style.color = '#949496';
        meta.textContent = p.pages ? `${p.body_pages}/${p.page_count} pages` : '';
        li.appendChild(info);
        li.appendChild(meta);
        list.appendChild(li);
      });
    }
  }

  async function ask() {
    const q = el('question').value.trim();
    if (!q) return;
    el('askBtn').disabled = true;
    el('askBtn').textContent = 'Searching...';
    el('resultHeader').style.display = 'none';
    el('resultPreview').style.display = 'none';
    el('resultPreview').textContent = '';
    const body = el('scoresBody');
    body.innerHTML = '<tr><td colspan="5" class="empty-state">Searching...</td></tr>';
    showLoading(true);
    try {
      const data = await fetchJSON('/ask', 'POST', { question: q });
      el('askBtn').disabled = false;
      el('askBtn').textContent = 'Ask';
      if (!data.ok) {
        body.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:#ef4444;">Error: ${data.error}</td></tr>`;
        return;
      }
      renderResults(data.data.results);
    } catch (e) {
      el('askBtn').disabled = false;
      el('askBtn').textContent = 'Ask';
      body.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:#ef4444;">Error: ${e.message}</td></tr>`;
    } finally {
      showLoading(false);
    }
  }

  async function askDocument() {
    const path = el('docPath').value.trim();
    if (!path) {
      alert('Please enter a PDF path.');
      return;
    }
    el('askDocBtn').disabled = true;
    el('askDocBtn').textContent = 'Searching...';
    el('resultHeader').style.display = 'none';
    el('resultPreview').style.display = 'none';
    el('resultPreview').textContent = '';
    const body = el('scoresBody');
    body.innerHTML = '<tr><td colspan="5" class="empty-state">Searching...</td></tr>';
    showLoading(true);
    try {
      const data = await fetchJSON('/api/ask-document', 'POST', { path: path });
      el('askDocBtn').disabled = false;
      el('askDocBtn').textContent = 'Ask with Document';
      if (!data.ok) {
        body.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:#ef4444;">Error: ${data.error}</td></tr>`;
        return;
      }
      renderResults(data.data.results);
    } catch (e) {
      el('askDocBtn').disabled = false;
      el('askDocBtn').textContent = 'Ask with Document';
      body.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:#ef4444;">Error: ${e.message}</td></tr>`;
    } finally {
      showLoading(false);
    }
  }

  function renderResults(results) {
    const top = results[0];
    const header = el('resultHeader');
    header.style.display = 'flex';
    el('resultTitle').textContent = top.title;
    const meta = [];
    if (top.year) meta.push(`Year: ${top.year}`);
    if (top.arxiv_id) meta.push(`arXiv: ${top.arxiv_id}`);
    meta.push(`Key: ${top.key}`);
    el('resultMeta').textContent = meta.join('  |  ');
    const scoreEl = el('resultScore');
    scoreEl.textContent = `Similarity: ${top.score.toFixed(4)}`;
    scoreEl.className = 'score-badge' + (top.score < 0.68 ? ' weak' : '');
    el('resultPreview').style.display = 'block';
    el('resultPreview').textContent = top.preview || '(No preview available)';

    const tbody = el('scoresBody');
    tbody.innerHTML = '';
    for (const r of results) {
      const tr = document.createElement('tr');
      const status = r.truncated ? '<span class="truncated-badge">truncated</span>' : '';
      tr.innerHTML = `<td class="rank">#${r.rank}</td><td>${r.score.toFixed(4)}</td><td>${r.key}</td><td>${r.title}${r.truncated ? ' <span class="truncated-badge">truncated</span>' : ''}</td><td>${status}</td>`;
      tbody.appendChild(tr);
    }
  }

  async function addPaper() {
    const path = el('pdfPath').value.trim();
    const name = el('paperName').value.trim();
    if (!path || !name) {
      alert('Please enter both a PDF path and a paper name.');
      return;
    }
    el('addBtn').disabled = true;
    el('addBtn').textContent = 'Adding...';
    showLoading(true);
    try {
      const data = await fetchJSON('/add', 'POST', { path, name });
      el('addBtn').disabled = false;
      el('addBtn').textContent = 'Add Paper';
      el('pdfPath').value = '';
      el('paperName').value = '';
      if (!data.ok) {
        alert('Error: ' + data.error);
        return;
      }
      await loadStatus();
      await loadPapers();
      showToast(data.data.message || 'Paper added.');
    } catch (e) {
      el('addBtn').disabled = false;
      el('addBtn').textContent = 'Add Paper';
      alert('Error: ' + e.message);
    } finally {
      showLoading(false);
    }
  }

  async function rebuild() {
    if (!confirm('Rebuild the entire index from saved collection? This will re-encode all papers.')) return;
    showLoading(true);
    try {
      const data = await fetchJSON('/rebuild', 'POST');
      if (data.ok) {
        await loadStatus();
        await loadPapers();
        showToast(data.data.message || 'Index rebuilt.');
      } else {
        alert('Error: ' + data.data.error);
      }
    } catch (e) {
      alert('Error: ' + e.message);
    } finally {
      showLoading(false);
    }
  }

  function showToast(msg) {
    const banner = el('addBanner');
    banner.textContent = msg;
    banner.style.display = 'block';
    setTimeout(() => { banner.style.display = 'none'; }, 3000);
  }

  el('browseBtn').addEventListener('click', () => {
    el('filePicker').click();
  });

  el('filePicker').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      el('pdfPath').value = file.path || file.name;
      if (!file.path || file.path.includes('fakepath')) {
        el('pdfPath').value = file.name;
        el('pdfPath').focus();
        el('pdfPath').select();
      }
    }
  });

  el('docBrowseBtn').addEventListener('click', () => {
    el('docFilePicker').click();
  });

  el('docFilePicker').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      el('docPath').value = file.path || file.name;
      if (!file.path || file.path.includes('fakepath')) {
        el('docPath').value = file.name;
        el('docPath').focus();
        el('docPath').select();
      }
    }
  });

  el('askBtn').addEventListener('click', ask);
  el('addBtn').addEventListener('click', addPaper);
  el('listBtn').addEventListener('click', loadPapers);
  el('rebuildBtn').addEventListener('click', rebuild);
  el('askDocBtn').addEventListener('click', askDocument);

  el('question').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      ask();
    }
  });

  el('docPath').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      askDocument();
    }
  });

  // Tab switching
  const tabText = el('tabText');
  const tabDocument = el('tabDocument');
  const tabTextContent = el('tabTextContent');
  const tabDocumentContent = el('tabDocumentContent');

  tabText.addEventListener('click', () => {
    tabText.classList.add('active');
    tabDocument.classList.remove('active');
    tabTextContent.classList.add('active');
    tabDocumentContent.classList.remove('active');
  });

  tabDocument.addEventListener('click', () => {
    tabDocument.classList.add('active');
    tabText.classList.remove('active');
    tabDocumentContent.classList.add('active');
    tabTextContent.classList.remove('active');
  });

  loadStatus();
  loadPapers();
</script>
</body>
</html>
